[project]
name = "curriculum_walking"
version = "0.1.0"
description = "Thesis for creating a curriculum based environment for bipedal locomotion using reinforcement learning."
authors = [
    { name = "Anton Utz", email = "your.email@example.com" }
]
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.6.0",
    "matplotlib>=3.3.0",
    "gymnasium>=1.0.0",
    "mujoco>=3.0.0",
    "stable_baselines3>=2.0.0",
    "torch>=1.8.0",
    "imageio>=2.9.0",
    "pyyaml>=5.4.0",
    "tensorboard>=2.4.0"
]

[tool.setuptools.packages.find]
where = ["src", "policies", "env", "utility"]

[project.urls]
Homepage = "https://github.com/yourusername/minimal_cassie_walking"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"