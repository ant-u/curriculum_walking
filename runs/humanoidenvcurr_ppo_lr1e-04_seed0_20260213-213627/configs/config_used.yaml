PPO_CONFIG:
    algo: PPO
    batch_size: 256
    clip_range: 0.15
    device: cpu
    ent_coef: 0.01
    gae_lambda: 0.9
    gamma: 0.99
    learning_rate: 0.0001
    max_grad_norm: 0.3
    n_epochs: 15
    n_steps: 4096
    normalize_advantage: true
    partition: Krater
    policy: MlpPolicy
    seed: 0
    tensorboard_log: true
    timesteps: 50000000.0
    verbose: 1
    vf_coef: 1.0
---
ENV_CONFIG:
    clip_reward: 10
    env_id: HumanoidEnvCurr
    env_kwargs: {}
    geom_z_gap: 0.001
    max_steps: 0
    min_diff_torso_feet: 0.2
    n_envs: 12
    n_points_x: 6
    n_points_y: 5
    norm_obs: true
    norm_reward: true
    render_lidar: true
    seed: 0
    terminate_at_x_border: 60
    use_levels: true
    use_lidar: true
    use_relative_height: false
    x_forward: 4
    x_start: 0
    xml_file: humanoid_plane.xml
    y_width: 1.5
---
CURR_CONFIG:
    buffer_init_fill_ratio: 0.1
    buffer_init_lower_cap:
    - 0
    - 0
    - 0
    - 0
    - 0
    buffer_init_upper_cap:
    - 0.3
    - 0.1
    - 0.1
    - 0.1
    - 0.1
    buffer_size: 300
    evaluation_episode_steps: 1500
    mutation_edit_size:
    - -0.02
    - 0.05
    mutation_number: 2
    regret_threshold_buffer: 0.05
    regret_threshold_replay: 0.045
    replay_decision_distribution:
    - 0.1
    - 0.9
    seed: null
---
CALLBACK_CONFIG:
    checkpoint_cb_conf:
        name_prefix: ckpt
        save_freq: 3000000
        save_vecnormalize: true
    eval_env_conf:
        deterministic: true
        env_seed: 0
        eval_freq: 500000
        max_steps: 20000
        n_envs: 5
        n_eval_episodes: 5
        render: false
    plot_callback:
        log_level: 2
        window: 100
